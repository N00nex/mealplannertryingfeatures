services:
    rustfs:
        image: rustfs/rustfs:latest
        container_name: rustfs
        ports:
            - "9000:9000"
            - "9001:9001"
        volumes:
            - rustfs-data:/data
        environment:
            - RUSTFS_ACCESS_KEY=rustfsadmin
            - RUSTFS_SECRET_KEY=rustfsadmin123
            - RUSTFS_CONSOLE_ENABLE=true
        restart: unless-stopped

volumes:
    rustfs-data:
